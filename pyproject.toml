[project]
name = "archivist"
version = "0.1.0"
description = "The Archivist — personal media-archival CLI for the Lee Family library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "keyring>=25.0",
    "tzdata>=2024.1",
]

[project.scripts]
archivist = "archivist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archivist"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
